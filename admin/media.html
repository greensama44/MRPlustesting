<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Media — Mega Rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--k:#0b0b0b;--y:#ffd800;--r:#e10600;--p:#f5f4ef;--l:#dedbd0;--b:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}body{font:500 14px/1.45 var(--b);background:var(--p);color:var(--k)}button,input,select{font:inherit;color:inherit;cursor:pointer;border:0;background:none}input{cursor:text}
.tb{position:sticky;top:0;z-index:30;display:flex;gap:14px;align-items:center;padding:14px clamp(16px,3vw,36px);background:var(--k);color:#fff}
.tb .lg{font-weight:700;letter-spacing:-.02em;color:#fff;text-decoration:none;white-space:nowrap}.tb .lg small{color:var(--y);font-weight:600;margin-left:6px}
.sr{flex:1;max-width:520px}.sr input{width:100%;padding:11px 16px;border-radius:99px;background:#1d1d1d;color:#fff}.sr input::placeholder{color:#888}
.jb{background:var(--y);color:var(--k);font-weight:700;padding:11px 20px;border-radius:99px;white-space:nowrap}.jb:hover{filter:brightness(.95)}.jb[disabled]{opacity:.5;cursor:wait}
.gh{background:#fff;box-shadow:inset 0 0 0 1.5px var(--l);padding:10px 16px;border-radius:99px;font-weight:600}.gh:hover{box-shadow:inset 0 0 0 1.5px var(--k)}.gh.rd{color:var(--r)}
.nt{background:#fff3b0;padding:9px clamp(16px,3vw,36px);font-size:12.5px}
main{padding:22px clamp(16px,3vw,36px) 80px;max-width:1500px;margin:auto}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.fl button{padding:8px 16px;border-radius:99px;background:#fff;font-weight:600;box-shadow:inset 0 0 0 1.5px var(--l)}.fl .on{background:var(--k);color:#fff;box-shadow:none}
#cnt{opacity:.6;margin:0 0 16px;font-size:13px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.cd{text-align:left;background:#fff;border-radius:14px;padding:10px 10px 14px;display:block;transition:transform .25s,box-shadow .25s}.cd:hover,.cd.sel{transform:translateY(-3px);box-shadow:0 14px 30px #0002}.cd.sel{outline:2px solid var(--k)}
.th{position:relative;aspect-ratio:4/3;border-radius:9px;overflow:hidden;background:var(--l);margin-bottom:10px}.th img,.th video{width:100%;height:100%;object-fit:cover;display:block}.th.lg img{object-fit:contain;padding:18px;background:#111}
.bd{position:absolute;left:8px;top:8px;background:var(--y);font:700 10px var(--b);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:99px}.bd.v{left:auto;right:8px;background:#fff}.bd.u{background:var(--r);color:#fff}
.cd b{display:block;font-weight:600;font-size:13.5px;margin:0 4px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cd small{display:block;margin:0 4px;opacity:.6;font-size:12px}
.em{padding:60px 0;text-align:center;opacity:.6}
.dp{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:50;overflow:auto;padding:22px;box-shadow:-30px 0 60px #0003;animation:in .35s cubic-bezier(.2,.7,.2,1)}@keyframes in{from{transform:translateX(40px);opacity:0}}
.dp h2{font-size:20px;letter-spacing:-.02em;margin:4px 40px 14px 0}.dp .x{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;background:var(--p);font-size:22px}
.pv{border-radius:12px;overflow:hidden;background:var(--l);margin-bottom:16px}.pv img,.pv video{display:block;width:100%;max-height:340px;object-fit:contain;background:#111}
dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0 0 18px;font-size:13px}dt{opacity:.55}dd{margin:0;word-break:break-word}
.dp h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin:20px 0 8px}
.us{list-style:none;padding:0;margin:0 0 6px}.us li{padding:9px 12px;background:var(--p);border-radius:10px;margin-bottom:6px;font-size:13px}.us a{font-weight:600;color:var(--k)}.us small{display:block;opacity:.65}
.ac{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.ac select{padding:9px 12px;border-radius:99px;background:var(--p)}
dialog{border:0;border-radius:16px;padding:20px;width:min(640px,94vw);max-height:84vh}dialog::backdrop{background:#000a}.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:14px 0}.pg button{border-radius:10px;overflow:hidden;background:var(--p);text-align:left}.pg img,.pg video{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.pg small{display:block;padding:6px 8px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ts{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--k);color:#fff;padding:12px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:92vw;text-align:center}#ts.on{opacity:1;transform:translate(-50%,0)}#ts.er{background:var(--r)}
@media(max-width:700px){.tb{flex-wrap:wrap}.sr{order:3;flex-basis:100%;max-width:none}.dp{padding:18px}dl{grid-template-columns:90px 1fr}}
</style></head><body>
<header class="tb"><a class="lg" href="../index.html">Mega Rewards<small>Media</small></a><div class="sr"><input id="q" type="search" placeholder="Search by name, page or section" aria-label="Search media"></div><button class="jb" id="up">Upload</button><input type="file" id="fi" hidden multiple accept="image/jpeg,image/png,image/webp,image/svg+xml,video/mp4,video/webm"></header>
<div class="nt">This screen has no login by design. Before launch, protect <b>/admin</b> with Vercel Password Protection so only your team can open it.</div>
<main><nav class="fl" id="fl" aria-label="Filter media"></nav><p id="cnt" aria-live="polite"></p><div class="gr" id="gr"></div></main>
<aside class="dp" id="dp" role="dialog" aria-modal="true" aria-label="Asset details" hidden></aside>
<dialog id="pk"><h2 id="pt" style="font-size:18px"></h2><div class="pg" id="pgd"></div><button class="gh" id="pc">Cancel</button></dialog>
<div id="ts" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T={'image/jpeg':'image','image/png':'image','image/webp':'image','image/svg+xml':'image','video/mp4':'video','video/webm':'video'};
const FM={map:'all',mobile:'mobile',video:'video'},TL={all:'All screens',mobile:'Mobile only',video:'Background video'};
const S={man:[],reg:{assets:[],map:{},mobile:{},video:{}},f:'all',q:'',sel:null,dims:{}};
const A=id=>S.reg.assets.find(a=>a.id===id),slot=k=>S.man.find(s=>s.key===k);
const eff=s=>{const a=A(S.reg.map[s.key]);return a?a.url:s.src};
const usedBy=a=>Object.entries(FM).flatMap(([f,t])=>Object.entries(S.reg[f]).filter(([,v])=>v===a.id).map(([k])=>({t,k})));
const replaced=s=>!!(S.reg.map[s.key]||S.reg.mobile[s.key]||S.reg.video[s.key]);
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const toast=(m,er)=>{const t=$('#ts');t.textContent=m;t.className='on'+(er?' er':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',er?5000:3200)};
const NOAPI=()=>new Error(location.protocol==='file:'?'This page was opened as a local file, so it cannot reach the media API. Open it from your deployed site (…/admin/media.html) or run "node scripts/dev-server.mjs" and visit http://localhost:8123/admin/media.html':'Cannot reach the media API (/api/media). If the latest changes have not been pushed and deployed yet, it does not exist on this site.');
async function call(p,o={}){const r=await fetch('/api/media/'+p,{method:o.body?'POST':'GET',credentials:'same-origin',headers:{'x-mr-admin':'1','content-type':'application/json'},body:o.body?JSON.stringify(o.body):undefined}).catch(()=>{throw NOAPI()});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Something went wrong');e.status=r.status;e.data=j;throw e}return j}
async function refresh(){S.reg=await call('list');draw();if(S.sel)detail(S.sel)}

/* ---------- library ---------- */
const FILT=[['all','All'],['image','Images'],['video','Videos'],['replaced','Replaced'],['uploads','Uploads'],['unused','Unused uploads']];
function items(){const q=S.q.trim().toLowerCase(),slots=S.man.map(s=>({t:'slot',id:s.key,s})),ups=S.reg.assets.map(a=>({t:'asset',id:a.id,a}));
 return [...slots,...ups].filter(i=>{
  if(S.f==='image'&&!(i.t==='slot'||i.a.kind==='image'))return false;
  if(S.f==='video'&&!(i.t==='asset'&&i.a.kind==='video'))return false;
  if(S.f==='replaced'&&!(i.t==='slot'&&replaced(i.s)))return false;
  if(S.f==='uploads'&&i.t!=='asset')return false;
  if(S.f==='unused'&&!(i.t==='asset'&&!usedBy(i.a).length))return false;
  if(!q)return true;
  const h=i.t==='slot'?[i.s.label,i.s.key,...i.s.pages.flatMap(p=>[p.page,...p.where])]:[i.a.name,i.a.type];
  return h.join(' ').toLowerCase().includes(q)})}
function draw(){
 $('#fl').innerHTML=FILT.map(([k,l])=>`<button data-f="${k}" class="${S.f===k?'on':''}" aria-pressed="${S.f===k}">${l}</button>`).join('');
 const L=items();$('#cnt').textContent=`${L.length} item${L.length===1?'':'s'} · ${S.man.length} site images, ${S.reg.assets.length} uploads`;
 $('#gr').innerHTML=L.length?L.map(i=>{
  if(i.t==='slot'){const s=i.s,r=replaced(s);return `<button class="cd ${S.sel===i.id?'sel':''}" data-id="${esc(i.id)}"><div class="th ${s.kind==='logo'?'lg':''}"><img src="${esc(eff(s))}" alt="" loading="lazy">${r?'<span class="bd">Replaced</span>':''}${S.reg.video[s.key]?'<span class="bd v">Video</span>':''}</div><b>${esc(s.label)}</b><small>${s.total} placement${s.total===1?'':'s'} · ${s.pages.length} page${s.pages.length===1?'':'s'}</small></button>`}
  const a=i.a,u=usedBy(a).length;return `<button class="cd ${S.sel===i.id?'sel':''}" data-id="${esc(i.id)}"><div class="th">${a.kind==='video'?`<video src="${esc(a.url)}#t=0.1" preload="metadata" muted playsinline></video><span class="bd v">Video</span>`:`<img src="${esc(a.url)}" alt="" loading="lazy">`}${u?'':'<span class="bd u">Unused</span>'}</div><b>${esc(a.name)}</b><small>${a.kind} · ${kb(a.size)} · ${u?u+' use'+(u===1?'':'s'):'not in use'}</small></button>`}).join(''):'<p class="em" style="grid-column:1/-1">Nothing matches. Try another search or filter.</p>'}

/* ---------- detail panel ---------- */
function usageHtml(s){return `<ul class="us">${s.pages.map(p=>`<li><a href="../${esc(p.page)}" target="_blank" rel="noopener">${esc(p.page.replace('.html',''))} ↗</a> · ${p.count}×<small>${esc(p.where.join(' · '))}</small></li>`).join('')}</ul>`}
function detail(id){S.sel=id;const el=$('#dp');el.hidden=false;draw();const s=slot(id);
 if(s){const a=A(S.reg.map[id]),m=A(S.reg.mobile[id]),v=A(S.reg.video[id]);
  el.innerHTML=`<button class="x" data-a="close" aria-label="Close">×</button><h2>${esc(s.label)}</h2><div class="pv">${v?`<video src="${esc(v.url)}" controls muted playsinline preload="metadata"></video>`:`<img id="pvi" src="${esc(eff(s))}" alt="Preview of ${esc(s.label)}">`}</div>
  <dl><dt>Type</dt><dd>${s.kind==='logo'?'Logo':s.kind==='local'?'Site image file':'Site photo (Unsplash)'}</dd><dt>Showing</dt><dd>${a?esc(a.name)+' ('+kb(a.size)+')':'Original'}</dd>${m?`<dt>Mobile</dt><dd>${esc(m.name)}</dd>`:''}${v?`<dt>Video</dt><dd>${esc(v.name)}</dd>`:''}<dt>Dimensions</dt><dd id="dm">${a&&a.w?a.w+' × '+a.h:'Loading…'}</dd><dt>Placements</dt><dd>${s.total} on ${s.pages.length} page${s.pages.length===1?'':'s'}</dd></dl>
  <h3>Where it is used</h3>${usageHtml(s)}
  <h3>Replace image</h3><div class="ac"><select id="tg" aria-label="Where to apply the replacement"><option value="all">All screens</option><option value="mobile">Mobile only</option></select><button class="jb" data-a="rep">Upload replacement</button><button class="gh" data-a="pick">Choose from uploads</button>${replaced(s)&&(a||m)?'<button class="gh" data-a="restore">Restore original</button>':''}</div>
  <h3>Background video</h3><p style="font-size:12.5px;opacity:.7;margin-bottom:8px">Plays muted behind the image where it appears. The image stays as the poster and for reduced-motion visitors.</p><div class="ac"><button class="gh" data-a="vup">Upload video</button><button class="gh" data-a="vpick">Choose a video</button>${v?'<button class="gh rd" data-a="vrm">Remove video</button>':''}</div>`;
  const im=$('#pvi');if(im)im.onerror=()=>{const d=$('#dm');if(d&&d.textContent==='Loading…')d.textContent='Preview unavailable'};if(im)im.onload=()=>{S.dims[id]=im.naturalWidth+' × '+im.naturalHeight;const d=$('#dm');if(d&&!(a&&a.w))d.textContent=S.dims[id]};
 }else{const a=A(id);if(!a){el.hidden=true;return}const u=usedBy(a);
  el.innerHTML=`<button class="x" data-a="close" aria-label="Close">×</button><h2>${esc(a.name)}</h2><div class="pv">${a.kind==='video'?`<video src="${esc(a.url)}" controls playsinline preload="metadata"></video>`:`<img src="${esc(a.url)}" alt="Preview of ${esc(a.name)}">`}</div>
  <dl><dt>Type</dt><dd>${esc(a.type)}</dd><dt>Size</dt><dd>${kb(a.size)}</dd><dt>Dimensions</dt><dd>${a.w?a.w+' × '+a.h:'Unknown'}${a.dur?' · '+a.dur+'s':''}</dd><dt>Uploaded</dt><dd>${new Date(a.at).toLocaleString()}</dd></dl>
  <h3>Used by (${u.length})</h3>${u.length?`<ul class="us">${u.map(x=>{const s=slot(x.k);return `<li><a href="#" data-a="goto" data-k="${esc(x.k)}">${esc(s?s.label:x.k)}</a> · ${TL[x.t]}</li>`}).join('')}</ul>`:'<p style="opacity:.6">Not used anywhere yet.</p>'}
  <div class="ac"><button class="jb" data-a="arep">Replace this file everywhere</button><button class="gh rd" data-a="del">Delete</button></div>`}
 el.scrollTop=0}
function close(){S.sel=null;$('#dp').hidden=true;draw()}

/* ---------- upload ---------- */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function meta(f){if(f.type.startsWith('video/'))return new Promise(r=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{r({w:v.videoWidth,h:v.videoHeight,dur:Math.round(v.duration)||0});URL.revokeObjectURL(v.src)};v.onerror=()=>r({});v.src=URL.createObjectURL(f)});
 if(f.type==='image/svg+xml')return {};try{const b=await createImageBitmap(f),d={w:b.width,h:b.height};b.close();return d}catch{return {}}}
async function send(f){if(!T[f.type])throw new Error('Unsupported file type. Use JPG, PNG, WebP, SVG, MP4 or WebM.');const d=await meta(f);
 if(f.size<=4.3*1048576){const r=await fetch('/api/media/upload',{method:'POST',credentials:'same-origin',headers:{'content-type':f.type,'x-mr-admin':'1','x-filename':encodeURIComponent(f.name),'x-width':d.w||0,'x-height':d.h||0,'x-duration':d.dur||0},body:f}).catch(()=>{throw NOAPI()}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Upload failed');return j}
 const {upload}=await import('https://esm.sh/@vercel/blob@2.8.2/client'),bl=await upload('media/direct-'+crypto.randomUUID().slice(0,8)+'-'+f.name.replace(/[^\w.\-]+/g,'-'),f,{access:'private',handleUploadUrl:'/api/media/token',contentType:f.type});
 return call('register',{body:{name:f.name,type:f.type,pathname:bl.pathname,hash:f.size<64e6?hex(await crypto.subtle.digest('SHA-256',await f.arrayBuffer())):'',...d}})}
async function guard(label,fn){const b=$('#up');b.disabled=true;toast(label+'…');try{return await fn()}catch(e){toast(e.message,1);throw e}finally{b.disabled=false}}
function choose(accept,cb,multi){const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=!!multi;i.onchange=()=>[...i.files].length&&cb([...i.files]);i.click()}
const IMG='image/jpeg,image/png,image/webp,image/svg+xml',VID='video/mp4,video/webm';

/* ---------- actions ---------- */
async function apply(key,asset,target){await call('assign',{body:{key,assetId:asset.id,target}});await refresh();const s=slot(key);toast(`${target==='video'?'Video added':'Replaced'}: updates ${s.total} placement${s.total===1?'':'s'} on ${s.pages.length} page${s.pages.length===1?'':'s'}`)}
async function picker(kind,cb){try{S.reg=await call('list')}catch(e){toast(e.message,1);return}const L=S.reg.assets.filter(a=>a.kind===kind);$('#pt').textContent=kind==='video'?'Choose a video':'Choose an uploaded image';
 $('#pgd').innerHTML=L.length?L.map(a=>`<button data-p="${a.id}">${kind==='video'?`<video src="${esc(a.url)}#t=0.1" preload="metadata" muted></video>`:`<img src="${esc(a.url)}" alt="" loading="lazy">`}<small>${esc(a.name)}</small></button>`).join(''):'<p style="opacity:.6">Nothing uploaded yet. Use Upload first.</p>';
 $('#pk').onclick=e=>{const b=e.target.closest('[data-p]');if(b){$('#pk').close();cb(A(b.dataset.p))}};$('#pk').showModal()}
document.addEventListener('click',async e=>{
 const f=e.target.closest('[data-f]');if(f){S.f=f.dataset.f;draw();return}
 const c=e.target.closest('.cd');if(c){detail(c.dataset.id);return}
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=S.sel,tg=($('#tg')||{}).value||'all';
 try{
 if(a==='close')close();
 else if(a==='goto'){e.preventDefault();S.f='all';detail(b.dataset.k)}
 else if(a==='rep')choose(IMG,async fs=>{const o=await guard('Uploading',()=>send(fs[0]));await apply(id,o.asset,tg)});
 else if(a==='pick')picker('image',async x=>apply(id,x,tg));
 else if(a==='restore'){await call('assign',{body:{key:id,assetId:null,target:tg}});await call('assign',{body:{key:id,assetId:null,target:tg==='all'?'mobile':'all'}}).catch(()=>{});await refresh();toast('Original restored')}
 else if(a==='vup')choose(VID,async fs=>{const o=await guard('Uploading video',()=>send(fs[0]));await apply(id,o.asset,'video')});
 else if(a==='vpick')picker('video',async x=>apply(id,x,'video'));
 else if(a==='vrm'){await call('assign',{body:{key:id,assetId:null,target:'video'}});await refresh();toast('Video removed')}
 else if(a==='arep'){const old=A(id);choose(old.kind==='video'?VID:IMG,async fs=>{const o=await guard('Uploading',()=>send(fs[0])),u=usedBy(old);for(const x of u)await call('assign',{body:{key:x.k,assetId:o.asset.id,target:x.t}});await refresh();detail(o.asset.id);toast(`Replaced in ${u.length} place${u.length===1?'':'s'}`)})}
 else if(a==='del'){const old=A(id),u=usedBy(old);if(!confirm(u.length?`“${old.name}” is still used in ${u.length} place${u.length===1?'':'s'}. Deleting it puts the original back in each of them. Delete anyway?`:`Delete “${old.name}”? This cannot be undone.`))return;
  await call('delete',{body:{id,force:true}});close();await refresh();toast('Deleted')}
 }catch(er){if(er&&er.message)toast(er.message,1)}});
$('#up').onclick=()=>choose(IMG+','+VID,async fs=>{let n=0,d=0;for(const f of fs){try{const o=await guard(`Uploading ${f.name}`,()=>send(f));o.dup?d++:n++}catch{}}await refresh();toast(`${n} uploaded${d?`, ${d} already in the library`:''}`)},true);
$('#pc').onclick=()=>$('#pk').close();
$('#q').oninput=e=>{S.q=e.target.value;draw()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dp').hidden&&!$('#pk').open)close()});
(async()=>{try{const [m,r]=await Promise.all([fetch('../media-manifest.json').then(x=>{if(!x.ok)throw new Error('media-manifest.json was not found next to the site.');return x.json()},()=>{throw NOAPI()}),call('list')]);S.man=m.assets;S.reg=r;draw()}catch(e){$('#gr').innerHTML='<p class="em" style="grid-column:1/-1">Could not load the media library. '+esc(e.message)+'</p>'}})();
</script></body></html>
